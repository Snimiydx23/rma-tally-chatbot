<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RMA Finance — Tally Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #0f172a; height: 100vh; display: flex; flex-direction: column; }
  header { background: #1e293b; color: #f1f5f9; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
  header h1 { font-size: 18px; font-weight: 600; }
  header select { background: #334155; color: #f1f5f9; border: none; padding: 8px 12px; border-radius: 6px; font-size: 14px; }
  #chat { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 70%; padding: 10px 14px; border-radius: 10px; line-height: 1.5; font-size: 14px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: #2563eb; color: white; }
  .msg.bot { align-self: flex-start; background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
  .msg.bot.loading { color: #94a3b8; font-style: italic; }
  #inputBar { display: flex; padding: 16px 24px; background: #1e293b; border-top: 1px solid #334155; gap: 10px; }
  #inputBar input { flex: 1; padding: 12px 14px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #f1f5f9; font-size: 14px; }
  #inputBar input:focus { outline: none; border-color: #2563eb; }
  #inputBar button { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
  #inputBar button:hover { background: #1d4ed8; }
  #inputBar button:disabled { background: #334155; cursor: not-allowed; }
  .hint { color: #64748b; font-size: 12px; padding: 0 24px 8px; }
</style>
</head>
<body>

<header>
  <h1>RMA Finance — Tally Assistant</h1>
  <select id="clientSelect">
    <option value="">Client auto-detect (naam likhein)</option>
  </select>
</header>

<div class="hint">Example: "Sharma Traders ka outstanding kitna hai?" ya "Devi Iron ka day book dikhao"</div>

<div id="chat"></div>

<div id="inputBar">
  <input type="text" id="queryInput" placeholder="Apna sawaal yahan likhein... (Hinglish chalega)" />
  <button id="sendBtn">Bhejein</button>
</div>

<script src="config.js"></script>
<script>
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('queryInput');
const sendBtn = document.getElementById('sendBtn');
const clientSelect = document.getElementById('clientSelect');

function addMessage(text, sender, loading = false) {
  const div = document.createElement('div');
  div.className = `msg ${sender}${loading ? ' loading' : ''}`;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

async function loadClients() {
  try {
    const res = await fetch(`${CENTRAL_API_URL}/api/clients`);
    const clients = await res.json();
    clients.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.client_id;
      opt.textContent = c.company_name;
      clientSelect.appendChild(opt);
    });
  } catch (e) {
    console.error('Client list load failed', e);
  }
}

async function sendQuery() {
  const query = inputEl.value.trim();
  if (!query) return;

  addMessage(query, 'user');
  inputEl.value = '';
  sendBtn.disabled = true;
  const loadingMsg = addMessage('Soch raha hoon...', 'bot', true);

  try {
    const res = await fetch(`${CENTRAL_API_URL}/api/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        query,
        client_id: clientSelect.value ? parseInt(clientSelect.value) : null,
      }),
    });
    const data = await res.json();
    loadingMsg.remove();
    addMessage(data.answer || 'Koi jawab nahi mila.', 'bot');
  } catch (e) {
    loadingMsg.remove();
    addMessage('Server se connect nahi ho paaya: ' + e.message, 'bot');
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener('click', sendQuery);
inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendQuery(); });

loadClients();
</script>
</body>
</html>
